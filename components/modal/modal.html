<!--
  Modal partial. Injected ONCE into #modal-container by profile.js's
  loadComponents() call — same pattern as navbar.html, not a
  <template> cloned per item like card.html/row.html. It listens
  globally for 'card:selected' events (dispatched by any card, see
  card.js) rather than being wired to a specific card.
-->
<div class="modal" id="modal-root" aria-hidden="true">
  <div class="modal__backdrop" id="modal-backdrop"></div>

  <div
    class="modal__panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
  >
    <button class="modal__close" id="modal-close" aria-label="Close">
      &times;
    </button>

    <div class="modal__media">
      <img class="modal__image" id="modal-image" src="" alt="" />
      <span class="modal__match" id="modal-match" hidden></span>
    </div>

    <div class="modal__body">
      <h2 class="modal__title" id="modal-title"></h2>
      <p class="modal__detail" id="modal-detail"></p>
      <a
        href=""
        class="modal__cta"
        id="modal-link"
        target="_blank"
        rel="noopener"
        hidden
        >Visit Project ↗</a
      >
    </div>
  </div>
</div>
